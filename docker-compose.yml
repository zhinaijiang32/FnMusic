services:
  tunecache-server:
    build:
      context: ./server
    image: tunecache-server:local
    container_name: tunecache-server
    ports:
      - "${TUNECACHE_PORT:-${FNMUSIC_PORT:-8443}}:8443"
    environment:
      NODE_ENV: production
      HTTPS_PORT: 8443
      DATA_DIR: /app/data
      MUSIC_STORE_PATH: /app/data/music
      INTERNAL_HOST: ${INTERNAL_HOST:-localhost}
    volumes:
      # Database, TLS certificate, and persistent JWT signing secret.
      - ${TUNECACHE_DATA_DIR:-${FNMUSIC_DATA_DIR:-./data}}:/app/data
      # Set MUSIC_CACHE_DIR to any writable host/NAS directory.
      - ${MUSIC_CACHE_DIR:-./data/music}:/app/data/music
    restart: unless-stopped
